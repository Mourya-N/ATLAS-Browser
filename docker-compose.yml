services:
  postgres:
    image: postgres:16-alpine
    container_name: atlas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-atlas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atlas_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-atlas_cloud}
    volumes:
      - atlas_postgres_data:/var/lib/postgresql/data
      - ./src/backend/db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-atlas} -d ${POSTGRES_DB:-atlas_cloud}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - atlas_internal

  redis:
    image: redis:7-alpine
    container_name: atlas-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - atlas_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - atlas_internal

  atlas-backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: atlas-cloud-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      ATLAS_BACKEND_HOST: 0.0.0.0
      ATLAS_BACKEND_PORT: 48080
      DATABASE_URL: postgresql://${POSTGRES_USER:-atlas}:${POSTGRES_PASSWORD:-atlas_dev_password}@postgres:5432/${POSTGRES_DB:-atlas_cloud}
      REDIS_URL: redis://redis:6379
      ATLAS_JWT_SECRET: ${ATLAS_JWT_SECRET:-dev-local-jwt-secret-replace-for-prod-32b}
      ATLAS_AI_PROVIDER: ${ATLAS_AI_PROVIDER:-gemini}
      ATLAS_SELF_HOSTED_URL: ${ATLAS_SELF_HOSTED_URL:-}
      ATLAS_SELF_HOSTED_MODEL: ${ATLAS_SELF_HOSTED_MODEL:-qwen2.5:7b-instruct}
      ATLAS_SELF_HOSTED_API_KEY: ${ATLAS_SELF_HOSTED_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY:-}
      GOOGLE_CSE_API_KEY: ${GOOGLE_CSE_API_KEY:-}
      GOOGLE_CSE_CX: ${GOOGLE_CSE_CX:-}
      BING_SEARCH_API_KEY: ${BING_SEARCH_API_KEY:-}
      ATLAS_ALLOW_MOCK_SEARCH: ${ATLAS_ALLOW_MOCK_SEARCH:-false}
      ATLAS_ALLOW_MOCK_AI: ${ATLAS_ALLOW_MOCK_AI:-false}
      ATLAS_INLINE_WORKER: "false"
    ports:
      - "127.0.0.1:48080:48080"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:48080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - atlas_internal

  atlas-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: atlas-cloud-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER:-atlas}:${POSTGRES_PASSWORD:-atlas_dev_password}@postgres:5432/${POSTGRES_DB:-atlas_cloud}
      REDIS_URL: redis://redis:6379
      ATLAS_JWT_SECRET: ${ATLAS_JWT_SECRET:-dev-local-jwt-secret-replace-for-prod-32b}
      ATLAS_AI_PROVIDER: ${ATLAS_AI_PROVIDER:-gemini}
      ATLAS_SELF_HOSTED_URL: ${ATLAS_SELF_HOSTED_URL:-}
      ATLAS_SELF_HOSTED_MODEL: ${ATLAS_SELF_HOSTED_MODEL:-qwen2.5:7b-instruct}
      ATLAS_SELF_HOSTED_API_KEY: ${ATLAS_SELF_HOSTED_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ATLAS_WORKER_POLL_MS: ${ATLAS_WORKER_POLL_MS:-2000}
    networks:
      - atlas_internal

  # Optional self-hosted LLM runtime container (opt-in via: docker compose --profile local-ai up)
  atlas-ollama:
    image: ollama/ollama:0.5.7
    container_name: atlas-local-llm
    profiles: ["local-ai"]
    restart: unless-stopped
    volumes:
      - atlas_ollama_models:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    networks:
      - atlas_internal

volumes:
  atlas_postgres_data:
  atlas_redis_data:
  atlas_ollama_models:

networks:
  atlas_internal:
    driver: bridge
