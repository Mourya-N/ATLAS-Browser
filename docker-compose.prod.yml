# Production Compose Override (Strict separation: no mock fallbacks, required secrets, internal DB/Redis)
services:
  lavray-backend:
    environment:
      NODE_ENV: production
      LAVRAY_ALLOW_MOCK_SEARCH: "false"
      LAVRAY_ALLOW_MOCK_AI: "false"
      LAVRAY_JWT_SECRET: ${LAVRAY_JWT_SECRET:?LAVRAY_JWT_SECRET must be set in production}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set in production}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      LAVRAY_INLINE_WORKER: "false"
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: "1.0"

  lavray-worker:
    environment:
      NODE_ENV: production
      LAVRAY_JWT_SECRET: ${LAVRAY_JWT_SECRET:?LAVRAY_JWT_SECRET must be set in production}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set in production}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: "1.0"
