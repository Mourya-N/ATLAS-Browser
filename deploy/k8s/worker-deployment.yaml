apiVersion: apps/v1
kind: Deployment
metadata:
  name: atlas-cloud-worker
  namespace: atlas-cloud
  labels:
    app: atlas-cloud-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: atlas-cloud-worker
  template:
    metadata:
      labels:
        app: atlas-cloud-worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: worker
          image: ghcr.io/mourya-n/atlas-cloud-worker:1.0.0
          envFrom:
            - secretRef:
                name: atlas-cloud-secrets
          env:
            - name: NODE_ENV
              value: "production"
            - name: ATLAS_WORKER_POLL_MS
              value: "2000"
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1024Mi"
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: atlas-cloud-worker-hpa
  namespace: atlas-cloud
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: atlas-cloud-worker
  minReplicas: 1
  maxReplicas: 15
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
