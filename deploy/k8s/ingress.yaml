apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lavray-cloud-ingress
  namespace: lavray-cloud
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
    - hosts:
        - api.lavraybrowser.example.com
      secretName: lavray-cloud-tls
  rules:
    - host: api.lavraybrowser.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: lavray-cloud-backend
                port:
                  number: 80
